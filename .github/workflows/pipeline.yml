name: pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  validar:
    name: Validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Ejecutar pruebas
        run: pytest --cov=src --cov-report=xml

      - name: Analisis de calidad
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=DivanoPerezNina_-INF384-lab2-20221481
            -Dsonar.qualitygate.wait=true

  publicar:
    name: Publicar artefacto
    needs: validar
    if: github.ref == 'refs/heads/main' && needs.validar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Leer version del paquete
        run: echo "VERSION=$(tr -d ' \t\r\n' < VERSION)" >> $GITHUB_ENV

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Construir el paquete
        run: python -m build

      - name: Publicar el paquete
        uses: actions/upload-artifact@v4
        with:
          name: despachos-${{ env.VERSION }}
          path: dist/
          overwrite: true
